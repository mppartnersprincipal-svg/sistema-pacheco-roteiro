squad:
  code: roteiros-solar
  name: "Squad de Roteiros | PachecoSolar"
  description: >
    Squad especializado em produzir roteiros de vídeo para a PachecoSolar,
    voltados para integradores e instaladores de energia solar.
    Suporta três tipos de conteúdo: Reels de Valor (educativo/orgânico),
    Reels Institucionais (marca e cultura) e Anúncios Meta Ads (conversão).
    Cada tipo tem estrutura, tom e CTA próprios — o agente escolhe o framework correto
    para cada objetivo: engajamento, autoridade ou geração de leads.
  version: "1.0.0"
  created: "2026-03-24"
  language: "pt-BR"

pipeline:
  steps:
    - id: checkpoint-briefing
      file: checkpoint-briefing.md
    - id: strategist
      file: strategist.md
    - id: checkpoint-hook
      file: checkpoint-hook.md
    - id: scriptwriter
      file: scriptwriter.md
    - id: checkpoint-approval
      file: checkpoint-approval.md
    - id: reviewer
      file: reviewer.md
